version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: t-bank-sem2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nifreebie
      POSTGRES_PASSWORD: nis150905
      POSTGRES_DB: link_tracker_db
    volumes:
      - postgres:/var/lib/postgresql/data

  liquibase:
    image: liquibase/liquibase
    container_name: liquibase_migrations
    depends_on:
      - postgres
    volumes:
      - ./migrations:/liquibase/migrations
    command: [ "update", "--url=jdbc:postgresql://postgres:5432/link_tracker_db", "--username=nifreebie", "--password=nis150905", "--changeLogFile=migrations/master.xml" ]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: |
        updates:1:1,
        dead-letter-queue:1:1
  redis:
    image: redis:7.0-alpine
    container_name: t-bank-sem2-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]

volumes:
  postgres:
  redis-data:
