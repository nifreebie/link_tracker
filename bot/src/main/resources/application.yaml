app:
  scrapper-api-url: http://localhost:8081/api/v1
  telegram-token: ${TELEGRAM_TOKEN}
  topics:
    updates: updates
    dlq: dead-letter-queue
  cache_ttl: 5
  response-timeout: 5s
  connection-timeout: 3s
  max-retries: 3
  backoff: 1s
  retry-status-codes:
    - 500
    - 502
    - 503
    - 504
    - 429

resilience4j:
  ratelimiter:
    configs:
      default:
        limitForPeriod: 1
        limitRefreshPeriod: 1m
        timeoutDuration: 0
    instances:
      publicApi:
        baseConfig: default
  circuitbreaker:
    instances:
      scrapperClientCircuit:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 1
        minimumNumberOfCalls: 1
        failureRateThreshold: 100
        permittedNumberOfCallsInHalfOpenState: 1
        waitDurationInOpenState: 1s

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:D:\java-nifreebie\bot\.env[.properties]
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bot-group
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
