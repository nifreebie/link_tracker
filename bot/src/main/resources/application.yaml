app:
  telegram-token: ${TELEGRAM_TOKEN}
  topics:
    updates: updates
    dlq: dead-letter-queue
  cache_ttl: 5

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:D:\java-nifreebie\bot\.env[.properties]
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bot-group
      auto-offset-reset: earliest
  #      properties:
  #        spring.json.trusted.packages: "backend.academy.bot.model.dto.request"
  #        spring.json.value.default.type: "backend.academy.bot.model.dto.request.LinkUpdateRequest"
  #        max.poll.records: 1
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
